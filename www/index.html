if(G.bye&&G.bye[dev])lvVote();else{lvSay("grace",{sec:LGR});LVC.t=setTimeout(()=>{if(LVC&&LVC.dev==dev&&LVC.ph=="grace")lvVote()},LGR*1000)}}
function lvSay(k,x){if(!G||G.mode!="host")return;const d={k,id:LVC?LVC.rid:0,nm:LVC?LVC.nm:"",...x};G.room.emit("lv",d).catch(()=>{});lvShow(d)}
function lvElig(){const s=[];G.p.forEach(p=>{if(!p.left&&p.dev!=LVC.dev&&lvConn(p.dev)&&!s.includes(p.dev))s.push(p.dev)});return s}
function lvVote(){if(!LVC)return;clearTimeout(LVC.t);LVC.ph="vote";LVC.rd=(LVC.rd||0)+1;LVC.votes={};LVC.until=Date.now()+LVT*1000;LVC.t=setTimeout(()=>lvTally(1),LVT*1000);lvTally(0)}
function lvTally(fin){if(!LVC||LVC.ph!="vote")return;const el=lvElig(),n=el.length;let w=0,g=0;el.forEach(d=>{const v=LVC.votes[d];if(v=="w")w++;else if(v=="g")g++});const need=(n>>1)+1;let r=null;
if(g>=need)r="g";else if(w>=need)r="w";else if(fin||w+g>=n)r=g>w?"g":w>g?"w":(w+g?"w":"g");
if(!r){lvSay("vote",{rd:LVC.rd,sec:Math.max(1,Math.ceil((LVC.until-Date.now())/1000)),w,g,n});return}
clearTimeout(LVC.t);r=="g"?lvGo():lvWait()}
function lvAns(from,d){if(!LVC||LVC.ph!="vote"||!d||d.id!=LVC.rid||d.rd!=LVC.rd||!from)return;if(!lvElig().includes(from))return;LVC.votes[from]=d.v=="g"?"g":"w";lvTally(0)}
function lvPick(v){if(!G)return;LVMY[LVKEY]=v;if(G.mode=="host"){if(LVC&&LVC.ph=="vote"){LVC.votes[G.me]=v;lvTally(0)}}else G.room.emit("lva",{id:LVID,rd:LVRD,v}).catch(()=>{});const m=$("#lvm");if(m&&m.dataset.k=="vote"){const a=$("#lvw"),b=$("#lvg");[a,b].forEach(x=>{if(x)x.disabled=true});(v=="w"?a:b)&&(v=="w"?a:b).classList.add("p")}}
function lvWait(){if(!LVC)return;LVC.ph="wait";lvSay("wait",{sec:LWT});LVC.t=setTimeout(()=>{if(LVC&&LVC.ph=="wait")lvVote()},LWT*1000)}
function lvHeir(i){const c=[];G.p.forEach((p,j)=>{if(p.alive&&p.role=="ciudadano"&&!p.left&&p.dev!=G.p[i].dev&&lvConn(p.dev))c.push(j)});return c.length?c[Math.random()*c.length|0]:-1}
function lvGo(){const dev=LVC.dev,L=LVC.L.slice(),nm=LVC.nm;let gone=0;
L.forEach(i=>{const p=G.p[i];if(!p.alive||p.role=="ciudadano")return;const role=p.role,j=lvHeir(i);
if(j>=0){const h=G.p[j];h.role=role;p.role="ciudadano";lvTell(j,role,p.name);if(G.nt&&!(G.nd&&G.nd[i]))G.nt.add(j)}
else{p.alive=0;gone=1}});
lvFlush(dev);lvEnd(gone?"gone":"go",nm)}
function lvTell(j,role,old){const h=G.p[j],mates=role=="mafia"?G.p.filter(x=>x.role=="mafia"&&x!==h&&x.alive).map(x=>x.name):[];lvNoteTo(h.dev,{k:"heir",role,mates,old,pn:h.name});
if(role=="mafia"){const seen={};G.p.forEach(x=>{if(x.role=="mafia"&&x!==h&&x.alive&&!x.left&&x.dev!=h.dev&&!seen[x.dev]){seen[x.dev]=1;lvNoteTo(x.dev,{k:"mate",nm:h.name,old})}})}}
function lvNoteTo(dev,d){d.to=dev;if(dev==G.me)lvNote(d);else G.room.emit("lvn",d).catch(()=>{})}
function lvNote(d){let m=$("#lvn");if(!m){m=document.createElement("div");m.id="lvn";m.className="ov n";document.body.appendChild(m)}
if(d.k=="heir"){const r=R[d.role]||R.ciudadano;m.innerHTML=`<div class="pc2"><div class="role"><div class="e">${r[0]}</div><h2>${esc(d.pn||"")}, ¡heredaste un rol!</h2><p>${esc(d.old||"Un jugador")} dejó la partida y ahora eres <b>${r[1]}</b>.</p><p class="mut">${r[2]}</p>${d.role=="mafia"?`<p class="mut">${d.mates&&d.mates.length?"Tus cómplices: <b>"+d.mates.map(x=>esc(x)).join(", ")+"</b>":"Eres el único mafioso."}</p>`:""}</div><button class="b p" onclick="lvNoteClose()">Entendido</button></div>`}
else m.innerHTML=`<div class="pc2"><div class="role"><div class="e">🔪</div><h2>Nuevo cómplice</h2><p>${esc(d.old||"Un mafioso")} dejó la partida. Ahora <b>${esc(d.nm)}</b> es de la mafia y juega contigo.</p></div><button class="b p" onclick="lvNoteClose()">Entendido</button></div>`;vib([60,40,60])}
function lvNoteClose(){const m=$("#lvn");if(m)m.remove()}
function lvFlush(dev){Object.keys(pd).forEach(t=>{const e=pd[t];if(e&&e.dev==dev&&pend[t]){const f=pend[t];delete pend[t];delete pd[t];f(e.defL())}})}
function lvEnd(kind,nm){if(LVC)clearTimeout(LVC.t);lvSay("done",{kind,nm});LVC=null;PZ.auto=Math.max(0,PZ.auto-1);pzApply();lvNext()}
function lvBack(dev){LVQ=LVQ.filter(x=>x!=dev);if(LVC&&LVC.dev==dev){clearTimeout(LVC.t);lvSay("back");LVC=null;PZ.auto=Math.max(0,PZ.auto-1);pzApply();lvNext()}}
function lvClose(){const m=$("#lvm");if(m)m.remove();if(LVI){clearInterval(LVI);LVI=0}}

let m=$("#lvm");if(!m){m=document.createElement("div");m.id="lvm";m.className="ov top";document.body.appendChild(m)}
LVID=d.id;LVRD=d.rd||0;LVKEY=d.id+":"+LVRD;if(LVI){clearInterval(LVI);LVI=0}const sec=+d.sec||0,cd=`<p class="coin" id="lvs"></p>`;let b="";
if(d.k=="grace")b=`<h2>⏳ ${esc(d.nm)} se desconectó</h2><p class="mut">Esperamos unos segundos por si vuelve…</p>${cd}`;
else if(d.k=="wait")b=`<h2>⏳ Esperando a ${esc(d.nm)}</h2><p class="mut">La partida sigue en pausa. Si no vuelve, se vota de nuevo.</p>${cd}`;
else if(d.k=="vote"){const can=G.mode=="host"||(!G.spec&&G.mine&&G.mine.length),my=LVMY[LVKEY],dis=my?"disabled":"";b=`<h2>⚠️ ${esc(d.nm)} no vuelve</h2><p class="mut">¿Qué hacemos? Si seguimos sin él, su rol pasa a un ciudadano para no perderlo.</p>${can?`<div class="two"><button class="b ${my=="w"?"p":""}" id="lvw" ${dis} onclick="lvPick('w')">⏳ Esperar</button><button class="b ${my=="g"?"p":""}" id="lvg" ${dis} onclick="lvPick('g')">▶️ Seguir sin él</button></div>`:`<p class="mut">Votan los jugadores.</p>`}<p class="mut">${d.n!=null?"Esperar: "+d.w+" · Seguir: "+d.g+" · votantes: "+d.n:""}</p>${cd}`}
else if(d.k=="done"){b=`<h2>${d.kind=="gone"?"🚪":"▶️"} ${esc(d.nm)} salió de la partida</h2><p class="mut">${d.kind=="gone"?"No había quién ocupara su lugar: queda fuera de la partida.":"La partida continúa."}</p>`;setTimeout(()=>{const e=$("#lvm");if(e&&e.dataset.k=="done")e.remove()},3500)}
m.dataset.k=d.k;m.innerHTML=`<div class="pc2">${b}</div>`;
if(sec&&d.k!="done"){const end=Date.now()+sec*1000,f=()=>{const e=$("#lvs");if(!e){clearInterval(LVI);LVI=0;return}e.textContent="⏱ "+Math.max(0,Math.ceil((end-Date.now())/1000))+" s"};f();LVI=setInterval(f,500)}}
